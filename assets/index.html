<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emi HealthFit</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #22c55e;
        --accent-2: #3b82f6;
        --danger: #ef4444;
        --radius: 14px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      .container {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px;
      }
      h1 { margin: 0 0 6px; font-size: 1.8rem; }
      .subtitle { color: var(--muted); margin-bottom: 24px; }
      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 20px;
        margin-bottom: 18px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
        font-size: 0.95rem;
      }
      input[type="text"], input[type="file"], textarea {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #334155;
        background: #0f172a;
        color: var(--text);
        font-size: 1rem;
      }
      input[type="file"] { padding: 10px; }
      textarea {
        resize: vertical;
        min-height: 80px;
      }
      .hint {
        color: var(--muted);
        font-size: 0.85rem;
        margin-top: 6px;
      }
      button {
        background: var(--accent);
        color: #052e16;
        border: none;
        padding: 12px 20px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        width: 100%;
        margin-top: 12px;
      }
      button.secondary {
        background: var(--accent-2);
        color: white;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .status {
        margin-top: 12px;
        padding: 12px;
        border-radius: 10px;
        background: #0f172a;
        font-size: 0.95rem;
        white-space: pre-wrap;
      }
      .status.ok { border-left: 4px solid var(--accent); }
      .status.error { border-left: 4px solid var(--danger); }
      .chat-history {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 12px;
        max-height: 60vh;
        overflow-y: auto;
      }
      .message {
        padding: 12px 16px;
        border-radius: 16px;
        max-width: 90%;
        word-break: break-word;
      }
      .message.user {
        align-self: flex-end;
        background: var(--accent-2);
      }
      .message.assistant {
        align-self: flex-start;
        background: #334155;
      }
      .message .meta {
        font-size: 0.7rem;
        color: var(--muted);
        margin-top: 4px;
      }
      .recovery {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .recovery.ready { background: #dcfce7; color: #14532d; }
      .recovery.caution { background: #fef9c3; color: #713f12; }
      .recovery.rest { background: #fee2e2; color: #7f1d1d; }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
      }
      .tab {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        background: var(--card);
        color: var(--muted);
        border: none;
        cursor: pointer;
        font-weight: 600;
      }
      .tab.active {
        background: var(--accent);
        color: #052e16;
      }
      .panel { display: none; }
      .panel.active { display: block; }
      footer {
        text-align: center;
        color: var(--muted);
        font-size: 0.8rem;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Emi HealthFit</h1>
      <p class="subtitle">Your personal gym assistant</p>

      <div class="card">
        <label for="url">Worker URL</label>
        <input type="text" id="url" placeholder="https://emi-healthfit.your-subdomain.workers.dev" />
        <p class="hint">Paste the URL printed when you ran <code>pnpm deploy</code>.</p>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="upload">Upload data</button>
        <button class="tab" data-tab="chat">Chat</button>
      </div>

      <div id="upload-panel" class="panel active">
        <div class="card">
          <label for="health">HealthExportKit JSON</label>
          <input type="file" id="health" accept=".json,application/json" />
          <p class="hint">From the HealthExportKit app export.</p>

          <label for="hevy" style="margin-top: 16px;">Hevy CSV</label>
          <input type="file" id="hevy" accept=".csv,text/csv" />
          <p class="hint">From Hevy: Profile → Settings → Export & Import Data → Export Workouts.</p>

          <button id="upload-btn">Upload</button>
          <div id="upload-status" class="status" style="display: none;"></div>
        </div>
      </div>

      <div id="chat-panel" class="panel">
        <div class="card">
          <label for="message">Ask anything</label>
          <textarea id="message" placeholder="what should I train today?"></textarea>
          <button id="chat-btn" class="secondary">Send</button>
          <div id="chat-status" class="status" style="display: none;"></div>
          <div id="chat-history" class="chat-history"></div>
        </div>
      </div>
    </div>

    <footer>Powered by Apple Health, Hevy, Cloudflare, and Effect.</footer>

    <script>
      const urlInput = document.getElementById("url");
      urlInput.value = localStorage.getItem("healthfit-url") || "";
      urlInput.addEventListener("input", () => localStorage.setItem("healthfit-url", urlInput.value));

      function baseUrl() {
        let url = urlInput.value.trim();
        if (!url) throw new Error("Please enter the Worker URL first.");
        return url.replace(/\/$/, "");
      }

      function setStatus(el, text, type) {
        el.style.display = "block";
        el.textContent = text;
        el.className = "status " + (type || "");
      }

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
          document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
          tab.classList.add("active");
          document.getElementById(tab.dataset.tab + "-panel").classList.add("active");
        });
      });

      document.getElementById("upload-btn").addEventListener("click", async () => {
        const status = document.getElementById("upload-status");
        try {
          const healthFile = document.getElementById("health").files[0];
          const hevyFile = document.getElementById("hevy").files[0];
          if (!healthFile && !hevyFile) {
            throw new Error("Please select at least one file.");
          }

          const form = new FormData();
          if (healthFile) form.append("health_export", healthFile);
          if (hevyFile) form.append("hevy_export", hevyFile);

          setStatus(status, "Uploading…", "");
          const res = await fetch(baseUrl() + "/ingest", { method: "POST", body: form });
          const json = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(json.error || "Upload failed.");
          setStatus(
            status,
            `Uploaded!\nHealth: ${json.health.daily} daily, ${json.health.workouts} workouts, ${json.health.sleep} sleep, ${json.health.body} body\nHevy: ${json.hevy.sessions} sessions, ${json.hevy.sets} sets`,
            "ok"
          );
        } catch (err) {
          setStatus(status, err.message, "error");
        }
      });

      const history = document.getElementById("chat-history");

      function addMessage(role, text, meta) {
        const div = document.createElement("div");
        div.className = "message " + role;
        if (meta) {
          const badge = document.createElement("span");
          badge.className = "recovery " + meta.className;
          badge.textContent = meta.label;
          div.appendChild(badge);
          div.appendChild(document.createElement("br"));
        }
        div.appendChild(document.createTextNode(text));
        if (meta && meta.model) {
          const m = document.createElement("div");
          m.className = "meta";
          m.textContent = meta.model;
          div.appendChild(m);
        }
        history.appendChild(div);
        history.scrollTop = history.scrollHeight;
      }

      document.getElementById("chat-btn").addEventListener("click", async () => {
        const status = document.getElementById("chat-status");
        const input = document.getElementById("message");
        const text = input.value.trim();
        if (!text) return;

        addMessage("user", text);
        input.value = "";
        setStatus(status, "Thinking…", "");

        try {
          const res = await fetch(baseUrl() + "/chat", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ message: text }),
          });
          const json = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(json.error || "Chat failed.");

          const className = json.recoveryLabel === "Ready" ? "ready" : json.recoveryLabel === "Caution" ? "caution" : "rest";
          addMessage("assistant", json.response, {
            label: json.recoveryLabel,
            className,
            model: json.model,
          });
          setStatus(status, "", "");
          status.style.display = "none";
        } catch (err) {
          setStatus(status, err.message, "error");
        }
      });

      document.getElementById("message").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          document.getElementById("chat-btn").click();
        }
      });
    </script>
  </body>
</html>
