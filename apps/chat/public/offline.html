<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Emi HealthFit</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0a0a0a;
        --fg: #fafafa;
        --muted: #a1a1aa;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --fg: #09090b;
          --muted: #71717a;
        }
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        padding: 2rem;
        max-width: 20rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
      }
      button {
        padding: 0.625rem 1.25rem;
        border: 1px solid currentColor;
        border-radius: 9999px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Emi HealthFit needs a connection to chat with your coach. Your cached sessions are still
        available once you're back online.
      </p>
      <button onclick="window.location.reload()">Retry</button>
    </main>
  </body>
</html>
