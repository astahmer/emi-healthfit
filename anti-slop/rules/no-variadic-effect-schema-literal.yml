id: no-variadic-effect-schema-literal
language: TypeScript
files:
  - apps/**/*.ts
  - packages/**/*.ts
ignores: ["**/*.test.ts"]
message: Use Schema.Literals([...]) for multiple Effect Schema literal values.
severity: error
rule:
  pattern: Schema.Literal($FIRST, $$$REST)
---
id: no-variadic-effect-schema-literal-tsx
language: Tsx
files:
  - apps/**/*.tsx
  - packages/**/*.tsx
ignores: ["**/*.test.tsx"]
message: Use Schema.Literals([...]) for multiple Effect Schema literal values.
severity: error
rule:
  pattern: Schema.Literal($FIRST, $$$REST)
