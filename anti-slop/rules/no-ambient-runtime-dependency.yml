id: no-ambient-runtime-dependency
language: TypeScript
files:
  - packages/core/src/runtime/**/*.ts
  - packages/core/src/runtime/**/*.tsx
  - packages/core/src/web/chat-runtime/**/*.ts
  - packages/core/src/web/chat-runtime/**/*.tsx
  - packages/core/src/server/ports/**/*.ts
  - packages/core/src/server/use-cases/**/*.ts
  - packages/core/src/server/use-cases/**/*.tsx
  - packages/core/src/server/db/**/*.ts
message: Runtime actors and server use cases must receive time, identity, transport, and browser capabilities through injected dependencies.
severity: error
rule:
  any:
    - pattern: Date.now()
    - pattern: new Date()
    - pattern: crypto.randomUUID()
    - pattern: globalThis.fetch($$$ARGS)
