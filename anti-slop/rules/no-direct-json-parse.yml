id: no-direct-json-parse
language: TypeScript
files:
  - apps/**/*.ts
  - packages/**/*.ts
ignores:
  - "**/*.test.ts"
message: Decode JSON with Effect Schema instead of JSON.parse.
severity: error
rule:
  pattern: JSON.parse($INPUT)
