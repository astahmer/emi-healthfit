id: no-direct-json-parse-tsx
language: Tsx
files:
  - apps/**/*.tsx
  - packages/**/*.tsx
ignores:
  - "**/*.test.tsx"
message: Decode JSON with Effect Schema instead of JSON.parse.
severity: error
rule:
  pattern: JSON.parse($INPUT)
